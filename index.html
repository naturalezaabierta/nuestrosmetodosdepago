<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datos de pago — Naturaleza Abierta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --moss-050:#eef2ea;
    --moss-900:#1f3323;
    --moss-700:#2c4a35;
    --clay:#c68a3e;
    --clay-deep:#a8712f;
    --ink:#221f1a;
    --paper:#f7f5ee;
    --line:#d8d6c8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--moss-050);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:480px; margin:0 auto; padding:48px 24px 64px; }
  .leaf{ width:38px;height:38px;margin-bottom:22px; }
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:1.9rem;
    line-height:1.15;
    margin:0 0 10px;
    color:var(--moss-900);
    letter-spacing:-0.01em;
  }
  .sub{ color:#5b5648; font-size:0.98rem; margin:0 0 30px; max-width:42ch; }

  .acordeon{ display:flex; flex-direction:column; gap:12px; }
  .item{
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:8px;
    overflow:hidden;
  }
  .item-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px;
    cursor:pointer;
    user-select:none;
  }
  .item-header .nombre{ font-weight:600; font-size:1.02rem; color:var(--moss-900); }
  .item-header .flecha{ transition:transform .2s ease; color:var(--moss-700); font-size:1.1rem; }
  .item.abierto .item-header .flecha{ transform:rotate(180deg); }
  .item-body{
    display:none;
    padding:0 18px 18px;
  }
  .item.abierto .item-body{ display:block; }

  .cargando{ color:#5b5648; font-size:0.9rem; padding:6px 0 2px; }

  .campo-copiar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:6px;
    padding:11px 13px;
    margin-bottom:9px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .campo-copiar:active{ background:var(--moss-050); }
  .campo-copiar.copiado{ border-color:var(--moss-700); background:#eaf1ea; }
  .campo-copiar .txt{ min-width:0; }
  .campo-copiar .etq{ font-size:0.76rem; color:var(--clay-deep); font-weight:600; margin-bottom:2px; }
  .campo-copiar .val{ font-size:0.95rem; color:var(--ink); word-break:break-all; }
  .campo-copiar .icono{ flex-shrink:0; font-size:0.95rem; color:var(--moss-700); }

  .nota{
    font-size:0.85rem;
    color:var(--clay-deep);
    background:#fbf3e6;
    border-left:3px solid var(--clay);
    padding:9px 11px;
    border-radius:3px;
    margin-top:6px;
  }
  .error-item{ color:#8a3b2c; font-size:0.88rem; padding:6px 0 2px; }

  footer{
    margin-top:44px;
    padding-top:20px;
    border-top:1px solid var(--line);
    font-size:0.82rem;
    color:#8a8672;
  }
</style>
</head>
<body>
<div class="wrap">

  <svg class="leaf" viewBox="0 0 40 40" fill="none">
    <path d="M20 35C20 35 6 28 6 14C6 10 8 6 12 6C16 6 20 10 20 16C20 10 24 6 28 6C32 6 34 10 34 14C34 28 20 35 20 35Z" stroke="#2c4a35" stroke-width="1.6"/>
    <path d="M20 35V16" stroke="#2c4a35" stroke-width="1.4"/>
  </svg>

  <h1>Nuestros datos de pago</h1>
  <p class="sub">Toca el método que vas a usar y luego toca cada dato para copiarlo.</p>

  <div class="acordeon" id="acordeon">
    <p class="cargando" id="cargandoTipos">Cargando métodos disponibles…</p>
  </div>

  <footer>Naturaleza Abierta</footer>
</div>

<script>
  // ---- Cliente minimo a Supabase (sin CDN, fetch directo al REST/RPC) ----
  const SUPABASE_URL = "https://tgvcvnhrwswuxgjbpvwq.supabase.co";
  const SUPABASE_KEY = "sb_publishable_EKV8OM1y96u-DV_kUPGwkg_BZuGdf4D";

  const sb = {
    rpc: async function(fn, params){
      try{
        const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY },
          body: JSON.stringify(params || {})
        });
        let data = null;
        try{ data = await res.json(); }catch(_){ data = null; }
        if(!res.ok){
          return { data: null, error: { message: (data && (data.message || data.error)) || `HTTP ${res.status}` } };
        }
        return { data, error: null };
      }catch(ex){
        return { data: null, error: { message: ex.message || "fallo de red" } };
      }
    }
  };

  // ---- Datos que manda Valentina en el enlace ----
  //   ?tel=58412...        -> identifica al cliente (para saber qué método elige y darle siempre la misma cuenta)
  //   ?metodo=Zelle        -> abre ese método de una vez (los demás siguen visibles)
  //   ?compra=RES-...      -> (opcional) compra ya creada, p. ej. reservas de experiencias
  function normalizarTelWa(t){
    if(!t) return null;
    let d = t.replace(/\D/g,'');
    if(!d) return null;
    if(d.startsWith('0')) d = '58' + d.slice(1);
    else if(!d.startsWith('58')) d = '58' + d;
    return d;
  }
  const params = new URLSearchParams(window.location.search);
  const telWa = normalizarTelWa(params.get('tel'));
  const compraId = params.get('compra') || null;
  const metodoInicial = params.get('metodo') || null;

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function norm(s){
    return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
  }

  // Respaldo por pestaña: si el servidor no responde, se muestra la última cuenta vista.
  function claveSesion(tipo){ return `metodo_pago_sesion_${tipo}`; }
  function leerSesion(tipo){
    try{ const g = sessionStorage.getItem(claveSesion(tipo)); return g ? JSON.parse(g) : null; }catch(_){ return null; }
  }
  function guardarSesion(tipo, data){
    try{ sessionStorage.setItem(claveSesion(tipo), JSON.stringify(data)); }catch(_){}
  }

  function iconoTipo(tipo){
    return { 'Pago Móvil':'📱', 'Zelle':'💵', 'Binance':'🟡', 'PayPal':'🅿️', 'Zinli':'🔷' }[tipo] || '💳';
  }

  function renderCampos(contBody, data, tipo){
    const camposHtml = (data.campos || []).map((c, i) => `
      <div class="campo-copiar" data-valor="${encodeURIComponent(c.valor)}" data-idx="${i}">
        <div class="txt">
          <div class="etq">${esc(c.etiqueta)}</div>
          <div class="val">${esc(c.valor)}</div>
        </div>
        <div class="icono">⧉</div>
      </div>
    `).join('');
    const notaHtml = data.nota ? `<div class="nota">📌 ${esc(data.nota)}</div>` : '';
    contBody.innerHTML = camposHtml + notaHtml;

    contBody.querySelectorAll('.campo-copiar').forEach(el => {
      el.addEventListener('click', async () => {
        const valor = decodeURIComponent(el.dataset.valor);
        try{
          await navigator.clipboard.writeText(valor);
        }catch(_){
          // respaldo si el navegador bloquea el clipboard API
          const ta = document.createElement('textarea');
          ta.value = valor; document.body.appendChild(ta); ta.select();
          try{ document.execCommand('copy'); }catch(_){}
          document.body.removeChild(ta);
        }
        el.classList.add('copiado');
        const icono = el.querySelector('.icono');
        const original = icono.textContent;
        icono.textContent = '✅';
        setTimeout(() => { el.classList.remove('copiado'); icono.textContent = original; }, 1200);

        // Avisar que copió un dato de este método (no bloquea nada si falla)
        if(telWa){ sb.rpc('fn_marcar_copia_metodo_pago', { p_tel_wa: telWa, p_tipo: tipo }); }
      });
    });
  }

  async function abrirTipo(tipo, contBody){
    const guardado = leerSesion(tipo);

    // Sin teléfono en el enlace no hay a quién asignarle la cuenta:
    // se muestra la misma de esta visita para no gastar la rotación cada vez que abre el método.
    if(!telWa && guardado){
      renderCampos(contBody, guardado, tipo);
      return;
    }

    if(guardado) renderCampos(contBody, guardado, tipo);
    else contBody.innerHTML = `<p class="cargando">Cargando datos…</p>`;

    // Con teléfono: cada vez que abre un método se registra que ese es el que eligió.
    // El servidor le devuelve siempre la misma cuenta de ese método (no rota entre aperturas).
    const { data, error } = await sb.rpc('fn_obtener_metodo_pago_rotado', {
      p_tipo: tipo,
      p_tel_wa: telWa,
      p_compra_id: compraId
    });

    if(error || !data || data.ok === false){
      if(!guardado){
        contBody.innerHTML = `<p class="error-item">No pudimos cargar los datos de ${esc(tipo)}. Vuelve a intentar en unos segundos.</p>`;
      }
      return;
    }

    const cambio = !guardado || data.id !== guardado.id;
    guardarSesion(tipo, data);
    if(cambio) renderCampos(contBody, data, tipo);
  }

  (async () => {
    const cont = document.getElementById('acordeon');
    const { data: tipos, error } = await sb.rpc('fn_metodos_pago_tipos_activos', {});

    if(error || !tipos || tipos.length === 0){
      cont.innerHTML = `<p class="error-item">Por ahora no hay métodos de pago disponibles. Escríbele a Valentina para coordinar tu pago.</p>`;
      return;
    }

    cont.innerHTML = tipos.map(t => `
      <div class="item" data-tipo="${esc(t.tipo)}">
        <div class="item-header">
          <span class="nombre">${iconoTipo(t.tipo)} ${esc(t.tipo)}</span>
          <span class="flecha">▾</span>
        </div>
        <div class="item-body"></div>
      </div>
    `).join('');

    cont.querySelectorAll('.item').forEach(item => {
      const header = item.querySelector('.item-header');
      const body = item.querySelector('.item-body');
      const tipo = item.dataset.tipo;
      header.addEventListener('click', async () => {
        const abrir = !item.classList.contains('abierto');
        // Un solo acordeón abierto a la vez, para que no se vea desordenado.
        cont.querySelectorAll('.item.abierto').forEach(otro => { if(otro !== item) otro.classList.remove('abierto'); });
        item.classList.toggle('abierto', abrir);
        if(abrir) await abrirTipo(tipo, body);
      });
    });

    // Si el enlace trae ?metodo=..., ese método queda abierto de entrada (los demás siguen ahí por si cambia de opinión).
    if(metodoInicial){
      const objetivo = Array.from(cont.querySelectorAll('.item')).find(i => norm(i.dataset.tipo) === norm(metodoInicial));
      if(objetivo) objetivo.querySelector('.item-header').click();
    }
  })();
</script>
</body>
</html>
